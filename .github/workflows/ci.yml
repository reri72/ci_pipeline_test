name : C CI TEST PROJECT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name : checkout code
      uses: actions/checkout@v4

    - name : install dependencies
      run : sudo apt-get update && sudo apt-get install -y build-essential

    - name : Build
      run : make

    - name : Run test
      run : make test